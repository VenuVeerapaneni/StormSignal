name: Refresh official IMD warning

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-imd-warning
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Fetch the official Chennai district warning
        run: python scripts/update_imd_warnings.py

      - name: Publish changed warning data
        run: |
          if git diff --quiet -- data/imd-warning.json; then
            echo "No published warning-data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imd-warning.json
          git commit -m "Refresh official IMD district warning"
          git push
